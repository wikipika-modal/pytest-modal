name: probe d (matrix, if, concurrency)

on:
  push:
    branches: [alpha-packaging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  probe:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.15"]
        install: ["--resolution lowest-direct", "--resolution highest"]
        include:
          - { python: "3.12", install: "pytest==8.1.*" }
          - { python: "3.12", install: "pytest==9.1.*" }
    steps:
      - run: echo "${{ matrix.python }} ${{ matrix.install }}"
