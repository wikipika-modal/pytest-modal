[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-modal"
version = "0.0.1"
description = "Run a pytest session's tests across Modal sandboxes"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Modal Labs" }]
keywords = ["pytest", "modal", "sandbox", "parallel", "distributed", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=8", "modal>=1.6.2"]

[project.urls]
Homepage = "https://github.com/modal-labs/pytest-modal"
Documentation = "https://github.com/modal-labs/pytest-modal#readme"
Changelog = "https://github.com/modal-labs/pytest-modal/blob/main/CHANGELOG.md"
Issues = "https://github.com/modal-labs/pytest-modal/issues"

[project.entry-points.pytest11]
pytest_modal = "pytest_modal.plugin"

[dependency-groups]
test = ["pytest-cov>=7.1.0"]
dev = [{ include-group = "test" }, "ruff"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/example", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
