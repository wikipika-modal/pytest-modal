[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-modal"
version = "0.0.1"
description = "Run a pytest session's tests across Modal sandboxes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pytest>=8", "modal>=1.6"]
classifiers = ["Framework :: Pytest"]

[project.entry-points.pytest11]
pytest_modal = "pytest_modal.plugin"

[dependency-groups]
dev = ["ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
